name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Backend and Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"
          cache: true
          cache-dependency-path: back/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Build Backend
        working-directory: back
        run: |
          go mod download
          go build ./...

      - name: Build Frontend
        working-directory: front
        run: |
          npm ci
          npm run build

      # ----------------------------------------------------------------
      # Fitness functions
      # Contrato: docs/15-fitness-function-01.md
      # Decisión que verifican: adrs/ADR-005-estilo-hexagonal.md
      # ----------------------------------------------------------------
      - name: "FF-01 — El dominio no depende de infraestructura"
        run: bash ./scripts/fitness/ff-01-dominio-sin-infraestructura.sh

      - name: "FF-01 — Prueba negativa (la regla debe saber fallar)"
        run: bash ./scripts/fitness/ff-01-dominio-sin-infraestructura.sh --prueba-negativa

      - name: CI Summary
        if: always()
        run: |
          echo "Build Summary:"
          echo "  Backend:  Go 1.24.3"
          echo "  Frontend: Node 24.18.0 + npm"
          echo "  Fitness:  FF-01 (dominio sin infraestructura) + prueba negativa"
